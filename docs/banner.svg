<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="frontoffice-manager">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#14213d"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4ade80"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05"/>
    </pattern>
  </defs>
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>
  <g transform="translate(70,70)">
    <rect x="0" y="0" width="140" height="140" rx="20" fill="#0f172a" stroke="url(#accent)" stroke-width="3"/>
    <path d="M40 92 L70 62 L88 80 L118 48" fill="none" stroke="url(#accent)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="118" cy="48" r="8" fill="#22d3ee"/>
    <rect x="34" y="106" width="72" height="8" rx="4" fill="#334155"/>
  </g>
  <text x="250" y="130" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" fill="#f8fafc" letter-spacing="-1">frontoffice-manager</text>
  <text x="252" y="178" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="24" fill="#94a3b8">An AI standing manager for your fantasy football team.</text>
  <text x="252" y="212" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="20" fill="#64748b">Claude Code or Codex. ESPN or Sleeper. Your rules, written down. You keep the veto.</text>
  <g font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#0b1220">
    <rect x="252" y="236" width="118" height="30" rx="15" fill="url(#accent)"/><text x="311" y="256" text-anchor="middle">hourly watch</text>
    <rect x="382" y="236" width="140" height="30" rx="15" fill="url(#accent)"/><text x="452" y="256" text-anchor="middle">graded trades</text>
    <rect x="534" y="236" width="150" height="30" rx="15" fill="url(#accent)"/><text x="609" y="256" text-anchor="middle">kickoff reminders</text>
    <rect x="696" y="236" width="150" height="30" rx="15" fill="url(#accent)"/><text x="771" y="256" text-anchor="middle">second opinion</text>
  </g>
</svg>
