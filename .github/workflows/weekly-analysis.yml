# Weekly analysis with no computer and no AI subscription.
#
# Every tool this runs is plain Node arithmetic over free data. No model is
# called, nothing is sent to an AI provider, and nothing is written back to your
# league. It reads, it computes, it commits the reports to your own repo.
#
# SETUP, about five minutes:
#
#   1. Fork or template this repo, and make your copy PRIVATE. The reports
#      contain your league's rosters, and the .env you may add later contains
#      credentials.
#   2. Settings, Secrets and variables, Actions, and add these repository
#      secrets:
#
#        ESPN_LEAGUE_ID   the number in your ESPN team page URL
#        ESPN_TEAM_ID     your team's number in that same URL
#        ESPN_S2          browser cookie, see below
#        ESPN_SWID        browser cookie, including its curly braces
#
#      Get the cookies in a desktop browser logged in to ESPN: F12, Application,
#      Cookies, https://fantasy.espn.com. These are full access to your ESPN
#      account, so put them in secrets and nowhere else. Never in a file you
#      commit, never in an issue, never in a chat.
#
#   3. Actions tab, enable workflows, and run this one manually once to check it.
#
# HOW OFTEN IT RUNS. The full report is weekly, on Tuesday, because that is when
# a week has finished and there is something new to say about it. The ALERTS run
# more often, because what they catch is what you can still fix: an empty
# starting slot, a man on bye in your lineup, a starter who is out, somebody on
# your bench or on the wire projected higher, and the Wednesday to Friday
# practice reports.
#
# To change the cadence set a repository VARIABLE (Settings, Secrets and
# variables, Actions, then the Variables tab) named ALERTS:
#
#   ALERTS = gameday   the default. Wednesday, Thursday, Friday and Sunday.
#   ALERTS = daily     every morning.
#   ALERTS = off       Tuesday only, nothing else.
#
# You never have to edit this file to change it, which matters when the only
# device you own is a phone.
#
# YOU CAN STILL ASK IT THINGS. The free tier has no agent, but the reports are
# plain markdown sitting in your own repo. Open them on your phone, or paste one
# into any free AI chat and ask what to do about it. The tools also run on
# demand: the Actions tab has a Run workflow button, and every tool takes a week
# number. What the free tier does not include is something that acts for you.
#
# WHAT YOU GET, committed to reports/ in your own repo:
#
#   - lineup efficiency, what you scored against the best your roster could have
#   - all-play record, so you can tell schedule luck from being bad
#   - value over replacement by position, which changes who you should drop
#   - buy and sell boards ranked by usage rather than by points
#   - a streaming board built on the sportsbook number
#   - win probability for your matchup, simulated with correlated outcomes
#
# WHAT IT WILL NEVER DO: change your lineup, make a claim, send a trade, or talk
# to a model. For any of that you need an agent and a paid plan; see
# START-HERE.md. This workflow is the free half.

name: Analysis

on:
  schedule:
    # Tuesday 13:00 UTC: the full weekly report, after the scoring period turns.
    - cron: "0 13 * * 2"
    # Wednesday and Friday: practice reports publish through the week.
    - cron: "0 13 * * 3,5"
    # Thursday afternoon, before the night game.
    - cron: "0 21 * * 4"
    # Sunday morning, about two hours before the early kickoffs.
    - cron: "0 14 * * 0"
    # Monday and Saturday, only used when ALERTS is set to daily.
    - cron: "0 13 * * 1,6"
  workflow_dispatch:
    inputs:
      week:
        description: "Week to analyse. Leave blank for the current one."
        required: false

permissions:
  contents: write

jobs:
  analyse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Decide what this run should do
        id: plan
        env:
          ALERTS: ${{ vars.ALERTS }}
        run: |
          dow=$(date -u +%u)          # 1 Monday through 7 Sunday
          mode="${ALERTS:-gameday}"
          full=no; alerts=no
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            alerts=yes; full=yes
          elif [ "$dow" = "2" ]; then
            full=yes; alerts=yes        # Tuesday is always the full report
          else
            case "$mode" in
              off)   : ;;
              daily) alerts=yes ;;
              *)     case "$dow" in 3|4|5|7) alerts=yes ;; esac ;;
            esac
          fi
          echo "full=$full" >> "$GITHUB_OUTPUT"
          echo "alerts=$alerts" >> "$GITHUB_OUTPUT"
          echo "Mode $mode, weekday $dow. Full report: $full. Alerts: $alerts."

      - name: Check the secrets are present
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          ESPN_LEAGUE_ID: ${{ secrets.ESPN_LEAGUE_ID }}
          ESPN_TEAM_ID: ${{ secrets.ESPN_TEAM_ID }}
        run: |
          missing=""
          for v in ESPN_S2 ESPN_SWID ESPN_LEAGUE_ID ESPN_TEAM_ID; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "Missing repository secrets:$missing"
            echo "Add them under Settings, Secrets and variables, Actions."
            exit 1
          fi
          echo "All four secrets are set."

      - name: Build the ESPN reader
        if: steps.plan.outputs.full == 'yes'
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          ESPN_LEAGUE_ID: ${{ secrets.ESPN_LEAGUE_ID }}
          ESPN_TEAM_ID: ${{ secrets.ESPN_TEAM_ID }}
        run: |
          git clone --depth 1 https://github.com/tlo1216/espn-fantasy-mcp.git ../espn-fantasy-mcp
          cd ../espn-fantasy-mcp
          npm install --silent
          npm run build --silent
          # Writes stay off. This workflow reads and nothing else, and the flag
          # is the enforcement rather than a promise in a comment.
          cat > .env <<EOF
          ESPN_S2=$ESPN_S2
          ESPN_SWID=$ESPN_SWID
          ESPN_SPORT=ffl
          ESPN_SEASON=$(date +%Y)
          ESPN_LEAGUE_ID=$ESPN_LEAGUE_ID
          ESPN_TEAM_ID=$ESPN_TEAM_ID
          WRITES_ENABLED=false
          EOF

      - name: Work out which week to analyse
        if: steps.plan.outputs.full == 'yes'
        id: week
        if: steps.plan.outputs.full == 'yes'
        run: |
          if [ -n "${{ github.event.inputs.week }}" ]; then
            echo "week=${{ github.event.inputs.week }}" >> "$GITHUB_OUTPUT"
          else
            w=$(node tools/mcp-call.mjs get_league '{}' 2>/dev/null \
              | grep -o '"currentScoringPeriod":[0-9]*' | cut -d: -f2)
            # The scoring period has already turned over by Tuesday, so the week
            # worth reporting on is the one that just finished.
            echo "week=$(( ${w:-1} > 1 ? ${w:-1} - 1 : 1 ))" >> "$GITHUB_OUTPUT"
          fi

      - name: Run the analysis
        if: steps.plan.outputs.full == 'yes'
        env:
          ESPN_TEAM_ID: ${{ secrets.ESPN_TEAM_ID }}
        run: node tools/weekly.mjs --week ${{ steps.week.outputs.week }}

      - name: Run the alerts
        if: steps.plan.outputs.alerts == 'yes'
        env:
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          ESPN_LEAGUE_ID: ${{ secrets.ESPN_LEAGUE_ID }}
          ESPN_TEAM_ID: ${{ secrets.ESPN_TEAM_ID }}
        run: |
          mkdir -p reports
          node tools/alerts.mjs > reports/alerts.md || true
          cat reports/alerts.md

      - name: Commit the reports
        run: |
          git config user.name "weekly-analysis"
          git config user.email "actions@users.noreply.github.com"
          git add reports/ || true
          if git diff --staged --quiet; then
            echo "Nothing changed."
          else
            git commit -m "Analysis, $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Show the summary in the run log
        if: always()
        run: |
          for f in reports/alerts.md reports/backtest-week-*.md reports/lineup-week-*.md reports/market.md; do
            [ -f "$f" ] || continue
            echo "===== $f ====="
            head -40 "$f"
          done
